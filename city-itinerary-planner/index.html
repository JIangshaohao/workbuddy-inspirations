<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>烟火蓉城 · 成都3日行程规划</title>

<style>
  :root{
    /* Stripe 调色板 */
    --bg:#F6F9FC;
    --surface:#FFFFFF;
    --navy:#0A2540;
    --slate:#425466;
    --muted:#7A8B9E;
    --line:#E6EBF1;
    --line-soft:#EEF2F7;
    --blurple:#635BFF;
    --blurple-soft:rgba(99,91,255,.10);
    --cyan:#22D3EE;

    /* 四类 POI 配色 */
    --scenic:#059669;  --scenic-1:#34D399; --scenic-2:#059669; --scenic-soft:#ECFDF5;
    --food:#EA580C;    --food-1:#FBBF24;   --food-2:#EA580C;   --food-soft:#FFF7ED;
    --culture:#4F46E5; --culture-1:#8B85FF;--culture-2:#4F46E5;--culture-soft:#EEF0FF;
    --shop:#DB2777;    --shop-1:#F472B6;   --shop-2:#DB2777;   --shop-soft:#FDF2F8;

    --r-lg:20px;
    --r-md:14px;
    --r-sm:10px;

    --sh-1:0 1px 2px rgba(10,37,64,.05), 0 1px 3px rgba(10,37,64,.04);
    --sh-2:0 4px 12px rgba(10,37,64,.06), 0 1px 3px rgba(10,37,64,.05);
    --sh-3:0 12px 34px rgba(10,37,64,.10), 0 2px 6px rgba(10,37,64,.05);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--slate);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    font-size:14px;
    padding:18px 26px;
  }

  .page{
    max-width:1500px; height:100%; margin:0 auto;
    display:flex; flex-direction:column; gap:14px;
  }

  /* ==================== BANNER ==================== */
  .banner{
    position:relative; flex-shrink:0; overflow:hidden;
    border-radius:var(--r-lg);
    border:1px solid var(--line);
    background:
      radial-gradient(680px 320px at 10% -20%, rgba(99,91,255,.20), transparent 62%),
      radial-gradient(560px 300px at 90% -10%, rgba(34,211,238,.18), transparent 60%),
      radial-gradient(640px 340px at 74% 120%, rgba(236,72,153,.13), transparent 62%),
      linear-gradient(180deg,#FFFFFF 0%,#F7FAFF 100%);
    box-shadow:var(--sh-1), 0 14px 36px rgba(10,37,64,.06);
  }
  .banner::after{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,0) 46%);
  }
  .banner-inner{
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:36px 40px 34px; min-height:196px;
  }
  .banner-tag{
    display:inline-flex; align-items:center; gap:8px;
    font-size:11.5px; font-weight:700; letter-spacing:3.4px;
    color:var(--blurple); background:var(--blurple-soft);
    border:1px solid rgba(99,91,255,.18);
    padding:5px 15px; border-radius:999px; margin-bottom:15px;
  }
  .banner-title{
    font-size:46px; line-height:1.12; font-weight:800;
    color:var(--navy); letter-spacing:-.6px; margin-bottom:12px;
  }
  .banner-title .accent{
    font-style:normal;
    background:linear-gradient(100deg,#635BFF 0%,#22D3EE 105%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .banner-sub{
    font-size:14.5px; line-height:1.72; color:#5A6B85;
    max-width:770px;
  }

  /* 右侧徽章 */
  .banner-meta{
    position:absolute; right:32px; top:50%; transform:translateY(-50%); z-index:3;
    display:flex; align-items:stretch;
    padding:9px 5px; border-radius:16px;
    background:rgba(255,255,255,.74);
    backdrop-filter:blur(16px) saturate(1.5);
    -webkit-backdrop-filter:blur(16px) saturate(1.5);
    border:1px solid rgba(10,37,64,.07);
    box-shadow:0 10px 28px rgba(10,37,64,.09);
  }
  .banner-meta .item{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; padding:6px 20px; min-width:98px;
  }
  .banner-meta .item + .item{ border-left:1px solid rgba(10,37,64,.08); }
  .banner-meta .num{
    font-size:25px; font-weight:800; line-height:1.04;
    color:var(--navy); letter-spacing:-.6px;
  }
  .banner-meta .num i{ font-style:normal; font-size:15px; font-weight:700; margin-right:1px; }
  .banner-meta .lbl{ font-size:11.5px; color:var(--muted); letter-spacing:.4px; }

  /* ==================== DAY TABS ==================== */
  .tabbar{ flex-shrink:0; display:flex; justify-content:center; }
  .day-tabs{
    display:inline-flex; gap:5px; padding:5px;
    background:#EDF1F7; border:1px solid var(--line); border-radius:15px;
  }
  .day-tab{
    display:flex; align-items:center; gap:10px;
    padding:8px 18px 8px 14px; border-radius:11px; cursor:pointer;
    transition:background .22s ease, box-shadow .22s ease, transform .22s ease;
    user-select:none; background:transparent;
  }
  .day-tab:hover{ background:rgba(255,255,255,.62); }
  .day-tab.active{
    background:#fff;
    box-shadow:0 1px 2px rgba(10,37,64,.08), 0 7px 18px rgba(10,37,64,.08);
  }
  .dtag{
    flex-shrink:0; width:30px; height:30px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; letter-spacing:-.2px;
    background:#E3E9F2; color:#8898AA;
    transition:all .22s ease;
  }
  .day-tab.active .dtag{
    background:linear-gradient(135deg,#7C74FF,#5A52F0); color:#fff;
    box-shadow:0 3px 9px rgba(99,91,255,.34);
  }
  .tbox{ display:flex; flex-direction:column; line-height:1.3; }
  .t1{ font-size:10.5px; font-weight:700; letter-spacing:.7px; color:#93A2B5; }
  .t2{ font-size:13.5px; font-weight:600; color:#5A6B85; transition:color .22s ease; }
  .day-tab.active .t1{ color:var(--blurple); }
  .day-tab.active .t2{ color:var(--navy); }

  /* ==================== MAIN ==================== */
  .main{ display:flex; flex:1; min-height:0; gap:14px; }
  .card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r-lg); box-shadow:var(--sh-1);
  }

  /* ---------- 左侧时间轴 ---------- */
  .sidebar{
    width:418px; flex-shrink:0; display:flex; flex-direction:column; overflow:hidden;
  }
  .sidebar-head{
    flex-shrink:0; padding:15px 18px 13px;
    border-bottom:1px solid var(--line-soft);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .sh-left{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .sh-title{ font-size:15px; font-weight:700; color:var(--navy); letter-spacing:-.2px; }
  .sh-sub{ font-size:11.5px; color:var(--muted); }
  .sh-badge{
    flex-shrink:0; font-size:11.5px; font-weight:700; color:var(--blurple);
    background:var(--blurple-soft); border:1px solid rgba(99,91,255,.16);
    padding:4px 10px; border-radius:999px; white-space:nowrap;
  }

  .timeline{
    flex:1; min-height:0; overflow-y:auto;
    padding:16px 16px 20px 10px;
    display:flex; flex-direction:column;
  }

  .tl-row{
    display:grid; grid-template-columns:48px 26px 1fr;
    animation:tl-rise .42s cubic-bezier(.22,.61,.36,1) both;
  }
  @keyframes tl-rise{
    from{ opacity:0; transform:translateY(9px); }
    to{ opacity:1; transform:none; }
  }

  .tl-time{
    padding-top:19px; padding-right:8px; text-align:right;
    font-size:11.5px; font-weight:700; color:#93A2B5;
    font-variant-numeric:tabular-nums; letter-spacing:.2px;
  }
  .tl-row.on .tl-time{ color:var(--navy); }

  .tl-rail{ position:relative; }
  .tl-rail::before{
    content:''; position:absolute; left:50%; top:0; bottom:0;
    width:2px; margin-left:-1px; border-radius:2px;
    background:linear-gradient(180deg,#E3E9F2,#EDF1F7);
  }
  .tl-row:first-child .tl-rail::before{ top:26px; }
  .tl-row:last-child .tl-rail::before{ bottom:auto; height:26px; }

  .tl-dot{
    position:absolute; left:50%; top:22px; width:11px; height:11px;
    margin-left:-5.5px; border-radius:50%;
    background:#fff; border:2.5px solid var(--tc,#C9D3DF);
    box-shadow:0 0 0 3px rgba(255,255,255,.9);
    transition:all .22s ease; z-index:2;
  }
  .tl-row.on .tl-dot{
    background:var(--tc); border-color:#fff;
    box-shadow:0 0 0 3px var(--tc-soft), 0 0 0 5px rgba(255,255,255,.9);
  }

  .tl-card{
    position:relative; margin-bottom:13px;
    padding:13px 15px 13px 17px;
    background:#fff; border:1px solid var(--line); border-radius:var(--r-md);
    cursor:pointer; overflow:hidden;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
  }
  .tl-card::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--tc); opacity:.85;
  }
  .tl-card:hover{
    transform:translateY(-2px);
    border-color:#D8E0EA;
    box-shadow:var(--sh-2);
  }
  .tl-card.on{
    border-color:var(--tc);
    background:linear-gradient(135deg,var(--tc-soft) 0%, #fff 62%);
    box-shadow:0 0 0 3px var(--tc-soft), 0 10px 26px rgba(10,37,64,.09);
  }

  .tl-head{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .chip{
    flex-shrink:0; font-size:10.5px; font-weight:700; letter-spacing:.3px;
    padding:2px 8px; border-radius:6px;
    background:var(--tc-soft); color:var(--tc);
  }
  .tl-name{
    flex:1; min-width:0; font-size:14.5px; font-weight:700; color:var(--navy);
    letter-spacing:-.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .tl-dur{
    flex-shrink:0; font-size:11px; font-weight:600; color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .tl-desc{
    font-size:12.5px; line-height:1.62; color:#5A6B85;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .tl-meta{
    display:flex; flex-wrap:wrap; gap:4px 12px;
    margin-top:8px; font-size:11px; color:var(--muted);
  }
  .tl-meta b{ font-weight:600; color:#6B7C93; }

  /* ---------- 右侧地图 ---------- */
  .map-wrap{ flex:1; min-width:0; position:relative; overflow:hidden; }
  #map{ position:absolute; inset:0; }

  .map-legend{
    position:absolute; right:16px; bottom:16px; z-index:20;
    display:flex; align-items:center; gap:15px;
    padding:9px 15px; border-radius:12px;
    background:rgba(255,255,255,.90);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(10,37,64,.07);
    box-shadow:0 7px 22px rgba(10,37,64,.10);
  }
  .lg{ display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; color:#5A6B85; }
  .lg .sw{ width:9px; height:9px; border-radius:3px; }

  .map-chip{
    position:absolute; left:16px; top:16px; z-index:20;
    display:flex; align-items:center; gap:9px;
    padding:9px 14px; border-radius:12px;
    background:rgba(255,255,255,.90);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(10,37,64,.07);
    box-shadow:0 7px 22px rgba(10,37,64,.10);
    font-size:12px; font-weight:600; color:#5A6B85;
  }
  .map-chip .mc-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--blurple); box-shadow:0 0 0 4px var(--blurple-soft);
  }
  .map-chip b{ color:var(--navy); font-weight:700; }

  .map-fallback{
    position:absolute; inset:0; z-index:30;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; padding:36px; text-align:center;
    background:
      radial-gradient(520px 260px at 20% 10%, rgba(99,91,255,.14), transparent 62%),
      radial-gradient(460px 240px at 88% 90%, rgba(34,211,238,.14), transparent 62%),
      #FBFCFE;
  }
  .map-fallback.show{ display:flex; }
  .map-fallback h3{ font-size:15px; font-weight:700; color:var(--navy); }
  .map-fallback p{ font-size:12.5px; color:var(--muted); line-height:1.75; max-width:420px; }
  .map-fallback code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px;
    background:#EEF2F7; color:#5A6B85; padding:1px 6px; border-radius:5px;
  }

  /* 滚动条 */
  .timeline::-webkit-scrollbar{ width:7px; }
  .timeline::-webkit-scrollbar-track{ background:transparent; }
  .timeline::-webkit-scrollbar-thumb{ background:#DCE3EC; border-radius:4px; }
  .timeline::-webkit-scrollbar-thumb:hover{ background:#C6D0DC; }

  /* 信息窗（腾讯地图默认会给内容容器加 nowrap，必须显式重置，否则中文不换行被截断） */
  .iw{ width:256px; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
  .iw, .iw *{ white-space:normal !important; word-break:break-word; box-sizing:border-box; }
  .iw-top{ display:flex; align-items:center; gap:7px; margin-bottom:6px; }
  .iw-idx{
    width:20px; height:20px; border-radius:6px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; color:#fff;
  }
  .iw-time{ font-size:11px; font-weight:700; color:#7A8B9E; }
  .iw-name{ font-size:14px; font-weight:700; color:#0A2540; margin-bottom:5px; }
  .iw-desc{ font-size:12px; line-height:1.6; color:#5A6B85; }
  .iw-foot{
    margin-top:8px; padding-top:8px; border-top:1px solid #EEF2F7;
    font-size:11px; color:#7A8B9E; display:flex; flex-wrap:wrap; gap:3px 10px;
  }

  /* ==================== 响应式 ==================== */
  @media (max-width:1240px){
    .banner-meta{ position:static; transform:none; margin-top:22px; }
    .banner-inner{ padding:32px 26px 30px; }
    .banner-title{ font-size:38px; }
  }
  @media (max-width:1080px){
    body{ padding:14px; }
    .page{ height:auto; }
    .main{ flex-direction:column; }
    .sidebar{ width:100%; height:520px; }
    .map-wrap{ height:460px; }
    .banner-title{ font-size:31px; }
    .banner-meta .item{ min-width:80px; padding:6px 13px; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="page">

  <!-- ==================== BANNER ==================== -->
  <header class="banner">
    <div class="banner-inner">
      <span class="banner-tag" id="bTag">CHENGDU · 成 都</span>
      <h1 class="banner-title" id="bTitle">烟火<em class="accent">蓉城</em>，慢煮三日</h1>
      <p class="banner-sub" id="bSub">宽窄巷子的盖碗茶、草堂的诗、熊猫的憨、青城的道、九眼桥的夜 —— 三天时间，把成都的三千年慢慢过一遍。</p>
    </div>
    <div class="banner-meta" id="bMeta"></div>
  </header>

  <!-- ==================== DAY TABS ==================== -->
  <nav class="tabbar"><div class="day-tabs" id="dayTabs"></div></nav>

  <!-- ==================== MAIN ==================== -->
  <div class="main">
    <aside class="sidebar card">
      <div class="sidebar-head">
        <div class="sh-left">
          <span class="sh-title" id="shTitle">—</span>
          <span class="sh-sub" id="shSub">—</span>
        </div>
        <span class="sh-badge" id="shBadge">—</span>
      </div>
      <div class="timeline" id="timeline"></div>
    </aside>

    <section class="map-wrap card">
      <div id="map"></div>
      <div class="map-chip"><span class="mc-dot"></span><span id="mapChipText">—</span></div>
      <div class="map-legend">
        <span class="lg"><i class="sw" style="background:linear-gradient(135deg,var(--scenic-1),var(--scenic-2))"></i>景点</span>
        <span class="lg"><i class="sw" style="background:linear-gradient(135deg,var(--food-1),var(--food-2))"></i>美食</span>
        <span class="lg"><i class="sw" style="background:linear-gradient(135deg,var(--culture-1),var(--culture-2))"></i>文化</span>
        <span class="lg"><i class="sw" style="background:linear-gradient(135deg,var(--shop-1),var(--shop-2))"></i>购物</span>
      </div>
      <div class="map-fallback" id="mapFallback">
        <h3>地图未能加载</h3>
        <p>本页地图底图使用腾讯地图 JSAPI GL，Key 由 WorkBuddy 本地代理注入（页面源码中不含明文 Key），
           因此需在 <b>WorkBuddy 预览面板</b> 中打开。直接双击本地 <code>.html</code> 文件时，代理不可用，地图与路线将无法显示。</p>
      </div>
    </section>
  </div>

</div>

<script>
/* ==========================================================================
   1. 行程数据（坐标为腾讯地图 GCJ-02，已通过腾讯位置服务 WebService 解析）
   ========================================================================== */
const TYPE_META = {
  scenic:  { label:'景点', c1:'#34D399', c2:'#059669', soft:'#ECFDF5', ink:'#047857' },
  food:    { label:'美食', c1:'#FBBF24', c2:'#EA580C', soft:'#FFF7ED', ink:'#C2410C' },

  shop:    { label:'购物', c1:'#F472B6', c2:'#DB2777', soft:'#FDF2F8', ink:'#BE185D' }
};

const TRIP = {
  city:'成都',

  title:'烟火<em class="accent">蓉城</em>，慢煮三日',
  subtitle:'宽窄巷子的盖碗茶、草堂的诗、熊猫的憨、青城的道、九眼桥的夜 —— 三天时间，把成都的三千年慢慢过一遍。',
  center:[30.66, 104.06]
};

const ITINERARY = [
  {
    day:1, date:'10/09', label:'DAY 1', title:'老城人文 · 市井烟火',
    pois:[
      { id:'d1p1', time:'09:00', typeKey:'scenic', name:'人民公园 · 鹤鸣茶社',
        desc:'百年老茶馆里泡一碗盖碗茶，成都的慢生活从清晨开始。',
        lat:30.656930, lng:104.058613, duration:'1.5h', ticket:'免费 · 茶水¥20起', addr:'青羊区少城路12号',
        tag:'城市公园 · 百年茶馆',
        intro:'人民公园始建于1911年，是成都最老的公园。园内鹤鸣茶社建于1923年，竹椅、盖碗、长嘴铜壶，是"休闲之都"的活标本。采耳师傅穿行其间，一杯茶可以坐一上午。' },

      { id:'d1p2', time:'11:00', typeKey:'culture', name:'宽窄巷子',
        desc:'清代满城遗存的青砖巷子，川西民居与市井百态的交汇处。',

        intro:'由宽巷子、窄巷子、井巷子三条平行街道组成，是康熙年间"满城"的遗存，也是成都唯一保存完好的清代古街。青砖黛瓦、拴马石、门头花窗，一砖一瓦都是老成都的底片。商业化较重，逛巷子比买东西更值得。' },

      { id:'d1p3', time:'12:30', typeKey:'food', name:'奎星楼街',
        desc:'本地人排队的苍蝇馆子一条街，川菜的生猛与街头烟火气。',

/* ==========================================================================
   3. 地图（腾讯地图 JSAPI GL）
   ========================================================================== */
let map, markerLayer, polylineLayer, infoWindow;
let dayIdx = 0;
let routeToken = 0;
let mapReady = false;

function pinSvg(num, c1, c2){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="34" height="44" viewBox="0 0 34 44">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/>
    </linearGradient></defs>
    <path d="M17 1.6C8.4 1.6 1.5 8.5 1.5 17.1 1.5 28.5 17 42.4 17 42.4S32.5 28.5 32.5 17.1C32.5 8.5 25.6 1.6 17 1.6z"
      fill="url(#g)" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="17" cy="17" r="9.6" fill="#ffffff" fill-opacity="0.96"/>
    <text x="17" y="21.6" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
      font-size="13" font-weight="700" fill="${c2}">${num}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function buildMarkerStyles(){
  const styles = {};
  Object.keys(TYPE_META).forEach(k => {
    const t = TYPE_META[k];
    for (let n = 1; n <= 9; n++){
      styles[k + n] = new TMap.MarkerStyle({
        width:34, height:44, anchor:{ x:17, y:42 }, src:pinSvg(n, t.c1, t.c2)
      });
    }
  });
  return styles;
}

function initMap(){
  map = new TMap.Map('map', {
    center:new TMap.LatLng(TRIP.center[0], TRIP.center[1]),
    zoom:12,
    viewMode:'2D'
  });
  // 注意：不使用 mapStyleId —— 自定义样式需在腾讯位置服务控制台为 Key 单独开通

  markerLayer = new TMap.MultiMarker({
    id:'poi-markers', map:map, styles:buildMarkerStyles(), geometries:[]
  });

  polylineLayer = new TMap.MultiPolyline({
    id:'route-line', map:map,
    styles:{
      route:new TMap.PolylineStyle({
        color:'#635BFF', width:7, borderWidth:4, borderColor:'#ffffff',
        lineCap:'round', showArrow:true, arrowOptions:{ space:70 }
      })
    },
    geometries:[]
  });

  infoWindow = new TMap.InfoWindow({
    map:map, position:new TMap.LatLng(TRIP.center[0], TRIP.center[1]),
    offset:{ x:0, y:-44 }, enableCustom:true, content:''
  });
  infoWindow.close();

  // 点击地图点标记 → 联动左侧卡片
  markerLayer.on('click', evt => {
    const id = evt.geometry && evt.geometry.id;
    if (!id) return;
    const idx = ITINERARY[dayIdx].pois.findIndex(p => p.id === id);
    if (idx < 0) return;
    focusPoi(idx, { fly:false });
  });

  mapReady = true;
  switchDay(0, { fly:false });
}

/* ==========================================================================
   4. Tab / 列表 / 地图联动
   ========================================================================== */
function buildTabs(){
  const wrap = document.getElementById('dayTabs');
  wrap.innerHTML = ITINERARY.map((d, i) => `
    <div class="day-tab${i === 0 ? ' active' : ''}" data-idx="${i}">
      <span class="dtag">D${d.day}</span>
      <span class="tbox">
        <span class="t1">${d.label} · ${d.date}</span>
        <span class="t2">${d.title}</span>
      </span>
    </div>`).join('');
  wrap.querySelectorAll('.day-tab').forEach(el => {
    el.addEventListener('click', () => switchDay(Number(el.dataset.idx)));
  });
}

function renderTimeline(){
  const day = ITINERARY[dayIdx];
  const box = document.getElementById('timeline');
  box.innerHTML = day.pois.map((p, i) => {
    const t = TYPE_META[p.typeKey];
    return `
      <div class="tl-row" data-idx="${i}" style="--tc:${t.ink};--tc-soft:${t.soft};animation-delay:${i * 46}ms">
        <div class="tl-time">${p.time}</div>
        <div class="tl-rail"><span class="tl-dot"></span></div>
        <div class="tl-card" data-id="${p.id}">
          <div class="tl-head">
            <span class="chip">${t.label}</span>
            <span class="tl-name">${p.name}</span>
            <span class="tl-dur">${p.duration}</span>
          </div>
          <p class="tl-desc">${p.desc}</p>
          <div class="tl-meta"><span><b>门票</b> ${p.ticket}</span><span><b>位置</b> ${p.addr}</span></div>
        </div>
      </div>`;
  }).join('');

  box.querySelectorAll('.tl-card').forEach(el => {
    el.addEventListener('click', () => {
      const idx = Number(el.parentElement.dataset.idx);
      focusPoi(idx);
    });
  });

  document.getElementById('shTitle').textContent = `${day.label} · ${day.title}`;
  document.getElementById('shSub').textContent = `${day.date} · ${day.pois.length} 个站点`;
  document.getElementById('shBadge').textContent = `${day.pois.length} POI`;
  document.getElementById('mapChipText').innerHTML =
    `<b>${day.label}</b> · ${day.pois.length} 个站点 · ${day.pois[0].time} 出发`;
}

function renderMarkers(){
  const day = ITINERARY[dayIdx];
  markerLayer.setGeometries(day.pois.map((p, i) => ({
    id:p.id,
    styleId:p.typeKey + (i + 1),
    position:new TMap.LatLng(p.lat, p.lng),
    properties:{ title:p.name }
  })));

  const bounds = new TMap.LatLngBounds();
  day.pois.forEach(p => bounds.extend(new TMap.LatLng(p.lat, p.lng)));
  map.fitBounds(bounds, { padding:80 });
}

/* 先画直线兜底（保证「按顺序连线」必定可见），再尝试用驾车路线替换 */
function planRoute(){
  const day = ITINERARY[dayIdx];
  const pts = day.pois.map(p => new TMap.LatLng(p.lat, p.lng));
  const token = ++routeToken;

  if (pts.length < 2){ polylineLayer.setGeometries([]); return; }
  polylineLayer.setGeometries([{ id:'route', styleId:'route', paths:pts }]);

  if (typeof TMap.service === 'undefined' || !TMap.service.Driving) return;

  try {
    const svc = new TMap.service.Driving({ policy:'LEAST_TIME' });
    const params = { from:pts[0], to:pts[pts.length - 1] };
    if (pts.length > 2) params.waypoints = pts.slice(1, -1);

    svc.search(params).then(res => {
      if (token !== routeToken) return;                       // 已切天，丢弃过期结果
      const route = res && res.result && res.result.routes && res.result.routes[0];
      if (route && route.polyline && route.polyline.length){
        polylineLayer.setGeometries([{ id:'route', styleId:'route', paths:route.polyline }]);
      }
    }).catch(() => { /* 保留直线兜底 */ });
  } catch (e) { /* 保留直线兜底 */ }
}

function switchDay(idx, opts){
  opts = opts || {};
  dayIdx = idx;
  document.querySelectorAll('.day-tab').forEach((el, i) => el.classList.toggle('active', i === idx));
  renderTimeline();
  if (!mapReady) return;
  if (infoWindow) infoWindow.close();
  renderMarkers();
  planRoute();
  if (opts.fly !== false){
    const c = ITINERARY[idx].pois[0];
    map.easeTo({ center:new TMap.LatLng(c.lat, c.lng), duration:520 });
  }
}

/* 点击卡片 / 标记：地图平滑飞行到该点并弹出信息窗 */
function focusPoi(idx, opts){
  opts = opts || {};
  const day = ITINERARY[dayIdx];
  const p = day.pois[idx];
  if (!p) return;
  const t = TYPE_META[p.typeKey];

  document.querySelectorAll('.tl-row').forEach((row, i) => {
    row.classList.toggle('on', i === idx);
  });
  const card = document.querySelector(`.tl-card[data-id="${p.id}"]`);
  if (card) card.scrollIntoView({ behavior:'smooth', block:'nearest' });

  if (!mapReady) return;

  if (opts.fly !== false){
    map.easeTo({ center:new TMap.LatLng(p.lat, p.lng), zoom:15, duration:760 });
  }

  infoWindow.setPosition(new TMap.LatLng(p.lat, p.lng));
  infoWindow.setContent(`
    <div class="iw">
      <div class="iw-top">
        <span class="iw-idx" style="background:linear-gradient(135deg,${t.c1},${t.c2})">${idx + 1}</span>
        <span class="iw-time">${p.time} · ${t.label}</span>
      </div>
      <div class="iw-name">${p.name}</div>
      <div class="iw-desc">${p.intro}</div>
      <div class="iw-foot"><span>${p.duration}</span><span>${p.ticket}</span></div>
    </div>`);
  infoWindow.open();
}

    // SDK 未加载（例如直接双击本地文件，代理不可用）
    renderTimeline();
    document.getElementById('mapChipText').textContent = '地图不可用';
    showFallback();
    return;
  }

  try {
    initMap();
  } catch (e){
    console.error('[map] 初始化失败', e);
    renderTimeline();
    showFallback();
  }
});
</script>
</body>
</html>
