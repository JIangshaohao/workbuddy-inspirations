<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Velorah® — Where dreams rise through the silence.</title>
<meta name="description" content="Velorah designs tools for deep thinkers, bold creators, and quiet rebels. Digital spaces for sharp focus and inspired work." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          background: 'hsl(201 100% 13%)',
          foreground: 'hsl(0 0% 100%)',
          muted: 'hsl(0 0% 10%)',
          'muted-foreground': 'hsl(240 4% 66%)',
          primary: { DEFAULT: 'hsl(0 0% 100%)', foreground: 'hsl(0 0% 4%)' },
          secondary: 'hsl(0 0% 10%)',
          accent: 'hsl(0 0% 10%)',
          border: 'hsl(0 0% 18%)',
          input: 'hsl(0 0% 18%)'
        },
        fontFamily: {
          display: ['Instrumental Serif', 'serif'],
          body: ['Inter', 'sans-serif']
        }
      }
    }
  };
</script>
<style>
  :root {
    --font-display: 'Instrument Serif', serif;
    --font-body: 'Inter', sans-serif;
  }
  html, body { background: hsl(201 100% 13%); }
  body {
    font-family: var(--font-body);
    color: hsl(0 0% 100%);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, .font-display { font-family: var(--font-display); }

  /* 液态玻璃 */
  .liquid-glass {
    background: rgba(255, 255, 255, 0.01);
    background-blend-mode: luminosity;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: none;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    position: relative;
    overflow: hidden;
  }
  .liquid-glass::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
      rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
      rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  @keyframes fade-rise {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-rise { animation: fade-rise 0.8s ease-out both; }
  .animate-fade-rise-delay { animation: fade-rise 0.8s ease-out 0.2s both; }
  .animate-fade-rise-delay-2 { animation: fade-rise 0.8s ease-out 0.4s both; }

  @media (prefers-reduced-motion: reduce) {
    .animate-fade-rise, .animate-fade-rise-delay, .animate-fade-rise-delay-2 {
      animation: none;
    }
  }
  ::selection { background: rgba(255,255,255,0.25); }
</style>
</head>

<body class="min-h-[100dvh] overflow-x-hidden">

  <!-- 背景视频 -->
  <video
    class="absolute inset-0 w-full h-full object-cover z-0"
    autoplay loop muted playsinline preload="auto"
    aria-hidden="true">
    <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260314_131748_f2ca2a28-fed7-44c8-b9a9-bd9acdd5ec31.mp4" type="video/mp4" />
  </video>

  <div class="relative z-10 min-h-[100dvh] flex flex-col">

    <!-- 导航 -->
    <header class="relative z-10 flex items-center justify-between px-8 py-6 max-w-7xl mx-auto w-full">
      <a href="#" class="font-display text-3xl tracking-tight text-foreground">
        Velorah<sup class="text-xs">®</sup>
      </a>

      <nav class="hidden md:flex items-center gap-8" aria-label="Main">
        <a href="#" class="text-sm text-foreground transition-colors">Home</a>
        <a href="#" class="text-sm text-muted-foreground hover:text-foreground transition-colors">Studio</a>
        <a href="#" class="text-sm text-muted-foreground hover:text-foreground transition-colors">About</a>
        <a href="#" class="text-sm text-muted-foreground hover:text-foreground transition-colors">Journal</a>
        <a href="#" class="text-sm text-muted-foreground hover:text-foreground transition-colors">Reach Us</a>
      </nav>

      <a href="#journey" class="liquid-glass rounded-full px-6 py-2.5 text-sm text-foreground hover:scale-[1.03] transition-transform duration-300 will-change-transform">
        Begin Journey
      </a>
    </header>

    <!-- Hero -->
    <main class="relative z-10 flex flex-col items-center justify-center text-center px-6 pt-[90px] pb-40 flex-1">
      <h1 class="animate-fade-rise font-normal font-display text-5xl sm:text-7xl md:text-8xl leading-[0.95] tracking-[-2.46px] max-w-7xl">
        Where <em class="not-italic text-muted-foreground">dreams</em> rise <em class="not-italic text-muted-foreground">through the silence.</em>
      </h1>

      <p class="animate-fade-rise-delay text-muted-foreground text-base sm:text-lg max-w-2xl mt-8 leading-relaxed">
        We're designing tools for deep thinkers, bold creators, and quiet rebels. Amid the chaos, we build digital spaces for sharp focus and inspired work.
      </p>

      <a id="journey" href="#" class="animate-fade-rise-delay-2 liquid-glass rounded-full px-14 py-5 text-base text-foreground mt-12 hover:scale-[1.03] transition-transform duration-300 will-change-transform cursor-pointer">
        Begin Journey
      </a>
    </main>
  </div>

</body>
</html>
