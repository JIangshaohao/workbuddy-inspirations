<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>杭州3日自然山水游 · 地图行程指南</title>

    <style>
      /* ======================================================================
         设计令牌：三天各一色（湖蓝 / 茶绿 / 苇棕），呼应西湖、龙井茶园、西溪芦苇
         ====================================================================== */
      :root {
        --c1: #2f7fa8;
        --c2: #4f8a5b;
        --c3: #b08050;
        --ink: #23424c;
        --ink-2: #6d8a92;
        --ink-3: #9db3ba;
        --line: rgba(47, 127, 168, 0.16);
        --panel: rgba(255, 255, 255, 0.94);
        --ui-z: 1201; /* 必须 > 1000，否则被腾讯地图控件层遮挡、点击不响应 */
      }

      /* 地图容器必须有确定高度，否则底图整块空白 */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      .app {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #eef2f4;
      }
      .map {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* 全局细滚动条：站点清单溢出时，默认滚动条又粗又抢戏 */
      *::-webkit-scrollbar {
        width: 7px;
        height: 7px;
      }
      *::-webkit-scrollbar-track {
        background: transparent;
      }
      *::-webkit-scrollbar-thumb {
        background: rgba(125, 148, 155, 0.42);
        border-radius: 4px;
      }
      *::-webkit-scrollbar-thumb:hover {
        background: rgba(125, 148, 155, 0.62);
      }

      /* ======================================================================
         左侧行程面板
         ====================================================================== */
      .pnl {
        position: absolute;
        top: 16px;
        left: 16px;
        width: 332px;
        max-height: calc(100% - 32px);
        display: flex;
        flex-direction: column;
        z-index: var(--ui-z);
        background: var(--panel);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(47, 127, 168, 0.22);
        border-radius: 15px;
        box-shadow: 0 12px 34px rgba(20, 50, 60, 0.16);
        overflow: hidden;
      }
      .pnl-hd {
        flex: none;
        padding: 15px 18px 12px;
        background: linear-gradient(180deg, rgba(47, 127, 168, 0.1), rgba(255, 255, 255, 0));
        border-bottom: 1px solid var(--line);
      }
      .kick {
        font-size: 11.5px;
        letter-spacing: 0.06em;
        color: #5b8a99;
      }
      .pnl-hd h1 {
        margin: 6px 0 7px;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .pnl-sub {
        margin: 0;
        font-size: 12.5px;
        color: var(--ink-2);
      }
      .pnl-sub b {
        color: var(--ink);
        font-weight: 700;
      }
      .pnl-bd {
        flex: 1 1 auto;
        overflow-y: auto;
        min-height: 0;
        padding: 10px 12px 12px;
      }
      .pnl-ft {
        flex: none;
        padding: 9px 14px;
        border-top: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        gap: 5px 12px;
        font-size: 11.5px;
        color: var(--ink-2);
      }

      /* 每日分组标题（可点击，切换只看当天） */
      .day {
        margin-bottom: 8px;
      }
      .day:last-child {
        margin-bottom: 2px;
      }
      .g {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 8px 10px;
        border: 1px solid transparent;
        border-radius: 9px;
        background: rgba(47, 127, 168, 0.07);
        cursor: pointer;
        font: inherit;
        font-size: 13.5px;
        font-weight: 700;
        color: var(--ink);
        text-align: left;
        transition: background 0.15s ease;
      }
      .g:hover {
        background: rgba(47, 127, 168, 0.14);
      }
      .g i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex: none;
      }
      .g em {
        margin-left: auto;
        font-style: normal;
        font-size: 11px;
        font-weight: 400;
        color: #7d949b;
      }
      .g.off {
        opacity: 0.42;
      }

      .stops {
        list-style: none;
        margin: 4px 0 0;
        padding: 0 0 0 3px;
      }
      .stop {
        display: flex;
        gap: 9px;
        padding: 7px 8px;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .stop:hover {
        background: rgba(47, 127, 168, 0.08);
      }
      .stop.on {
        background: rgba(47, 127, 168, 0.17);
      }
      .sq {
        flex: none;
        width: 19px;
        height: 19px;
        margin-top: 1px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
        color: #fff;
      }
      .st-main {
        min-width: 0;
      }
      .stop b {
        display: block;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.35;
      }
      .stop .intro {
        display: block;
        margin-top: 2px;
        font-size: 11.5px;
        color: #7b9199;
        line-height: 1.5;
      }

      /* 站与站之间：下一程的交通方式 / 距离 / 耗时 */
      .seg {
        position: relative;
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 1px 0 1px 8px;
        padding: 3px 8px 3px 20px;
        font-size: 11.5px;
        color: #7b9199;
      }
      .seg::before {
        content: "";
        position: absolute;
        left: 9px;
        top: 0;
        bottom: 0;
        border-left: 1px dashed #b9ced6;
      }
      .seg-chip {
        flex: none;
        padding: 1px 6px;
        border-radius: 5px;
        font-size: 10.5px;
        line-height: 1.6;
        color: #fff;
        background: #7d949b;
      }
      .seg-chip[data-mode="walking"] {
        background: #4f8a5b;
      }
      .seg-chip[data-mode="driving"] {
        background: #2f7fa8;
      }
      .seg-chip[data-mode="transit"] {
        background: #b08050;
      }

      /* 面板底部：每日图例 */
      .lg {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .lg i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
      }
      .lg-line i {
        width: 18px;
        height: 0;
        border-radius: 0;
        border-top: 2px solid var(--ink-2);
      }

      /* ======================================================================
         右下角：手机端二维码
         ====================================================================== */
      .qr {
        position: absolute;
        right: 16px;
        bottom: 16px;
        z-index: var(--ui-z);
        width: 122px;
        text-align: center;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid rgba(47, 127, 168, 0.2);
        border-radius: 12px;
        padding: 8px 8px 6px;
        box-shadow: 0 10px 24px rgba(20, 50, 60, 0.14);
      }
      .qr img {
        width: 106px;
        height: 106px;
        display: block;
      }
      .qr span {
        display: block;
        margin-top: 4px;
        font-size: 11px;
        color: #5b8a99;
      }

      /* ======================================================================
         信息卡片（TMap.InfoWindow 内容）
         注意：内容容器要显式允许换行，否则长文本不折行
         ====================================================================== */
      .iw {
        width: 244px;
        padding: 2px 2px 4px;
        white-space: normal;
        word-wrap: break-word;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
      }
      .iw-badge {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 5px;
        font-size: 10.5px;
        line-height: 1.75;
        color: #fff;
      }
      .iw-name {
        margin: 6px 18px 0 0;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.35;
      }
      .iw-sub {
        margin: 4px 0 0;
        font-size: 12px;
        color: #5e7b84;
        line-height: 1.6;
      }
      .iw-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 9px;
      }
      .iw-tags span {
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(47, 127, 168, 0.1);
        color: #2f7fa8;
        font-size: 11px;
        line-height: 1.6;
      }
      .iw-tip {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 9px;
        background: rgba(176, 128, 80, 0.1);
        font-size: 11.5px;
        color: #6b5a45;
        line-height: 1.65;
      }
      .iw-tip b {
        display: block;
        margin-bottom: 3px;
        font-size: 11px;
        letter-spacing: 0.04em;
        color: #b08050;
      }

      /* ======================================================================
         加载 / 错误提示条
         ====================================================================== */
      .tip {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 1301;
        max-width: 78vw;
        transform: translate(-50%, -50%);
        padding: 13px 22px;
        border-radius: 12px;
        background: rgba(15, 17, 21, 0.86);
        color: #fff;
        font-size: 13px;
        line-height: 1.7;
      }
      .tip.is-error {
        background: rgba(176, 57, 44, 0.94);
      }

      /* ======================================================================
         窄屏：面板收到底部、二维码隐藏
         ====================================================================== */
      @media (max-width: 820px) {
        .pnl {
          top: auto;
          left: 8px;
          right: 8px;
          bottom: 8px;
          width: auto;
          max-height: 48%;
        }
        .qr {
          display: none;
        }
      }
    </style>

    <!--
      合规 Key 代理：必须在 SDK 之前配置。前端不携带任何明文 Key，
      SDK 内部请求自动路由到本地代理服务，密钥由代理侧持有。
      __WB_HTTP_PORT__ / __WB_TMAP_SECRET__ 为运行环境占位符，请勿替换为真实值。
    -->
    <script type="text/javascript">
      window._TMapSecurityConfig = {
        serviceHost: 'http://127.0.0.1:__WB_HTTP_PORT__/_TMapService/_wbt/__WB_TMAP_SECRET__'
      };
    </script>
  </head>

          var svg =
            '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="40" viewBox="0 0 30 40">' +
            '<path d="M15 1.6C7.6 1.6 1.6 7.6 1.6 15c0 9.6 13.4 23.4 13.4 23.4S28.4 24.6 28.4 15C28.4 7.6 22.4 1.6 15 1.6z" ' +
            'fill="' + color + '" stroke="#ffffff" stroke-width="2.4"/>' +
            '<text x="15" y="20.2" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" ' +
            'font-size="13" font-weight="700" fill="#ffffff">' + seq + "</text>" +
            "</svg>";
          return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
        }

        function boot() {
          var tip = document.getElementById("tip");
          try {
            var data = JSON.parse(document.getElementById("trip-data").textContent);

            /* ---------- 标题 / 日期区间 / 统计 ---------- */
            var totalStops = 0;
            var totalMeters = 0;
            data.days.forEach(function (d) {
              totalStops += d.stops.length;
              d.stops.forEach(function (s) {
                if (s.next && s.next.distance) totalMeters += s.next.distance;
              });
            });
            document.getElementById("u-range").textContent = data.subtitle;
            document.getElementById("u-title").textContent = data.title;
            document.getElementById("u-stats").innerHTML =
              "<b>" + data.days.length + "</b> 个日程 · <b>" + totalStops + "</b> 站 · <b>" +
              Math.round(totalMeters / 1000) + "</b> km";

            /* ---------- 扁平化站点，编号跨天连续 ---------- */
            var flat = [];
            data.days.forEach(function (day) {
              day.stops.forEach(function (s) {
                s._day = day;
                flat.push(s);
              });
            });

            /* ---------- 地图 ---------- */
            var map = new TMap.Map("map", {
              center: new TMap.LatLng(30.24, 120.14),
              zoom: 12,
              viewMode: "2D"
            });

            /* ---------- 编号标记：每天一色 ---------- */
            var markerStyles = {};
            var markerGeos = flat.map(function (s) {
              var styleId = "m" + s.seq;
              markerStyles[styleId] = new TMap.MarkerStyle({
                width: 30,
                height: 40,
                anchor: { x: 15, y: 40 },
                src: pinSvg(s._day.color, s.seq)
              });
              return {
                id: "m" + s.seq,
                styleId: styleId,
                position: new TMap.LatLng(s.lat, s.lng),
                properties: { seq: s.seq, day: s._day.id }
              };
            });
            var markerLayer = new TMap.MultiMarker({ map: map, styles: markerStyles, geometries: markerGeos });
            markerLayer.setStopPropagation(true);

            /* ---------- 每日足迹路线：沿真实道路的折线 ---------- */
            var lineStyles = {};
            var lineGeos = data.days
              .map(function (day) {
                lineStyles[day.id] = new TMap.PolylineStyle({
                  color: day.color,
                  width: 5,
                  borderWidth: 2,
                  borderColor: "#ffffff",
                  lineCap: "round"
                });
                var paths = [];
                day.stops.forEach(function (s) {
                  if (!s.next || !s.next.polyline) return;
                  var pts = decodePolyline(s.next.polyline);
                  for (var i = 0; i < pts.length; i++) {
                    if (paths.length && i === 0) continue; // 相邻段共用连接点，去重
                    paths.push(new TMap.LatLng(pts[i].lat, pts[i].lng));
                  }
                });
                if (paths.length < 2) return null;
                return { id: day.id, styleId: day.id, paths: paths, _day: day.id };
              })
              .filter(Boolean);
            var lineLayer = new TMap.MultiPolyline({ map: map, styles: lineStyles, geometries: lineGeos });

            /* ---------- 信息卡片 ---------- */
            var iw = new TMap.InfoWindow({
              map: map,
              position: new TMap.LatLng(flat[0].lat, flat[0].lng),
              offset: { x: 0, y: -42 },
              content: ""
            });
            iw.close();

            function iwHtml(s) {
              return (
                '<div class="iw">' +
                '<span class="iw-badge" style="background:' + s._day.color + '">' +
                esc(s._day.name) + " · 第 " + s.seq + " 站</span>" +
                '<h3 class="iw-name">' + esc(s.name) + "</h3>" +
                '<p class="iw-sub">' + esc(s.desc) + "</p>" +
                '<div class="iw-tags">' +
                s.tags.map(function (t) { return "<span>" + esc(t) + "</span>"; }).join("") +
                "</div>" +
                '<div class="iw-tip"><b>到达贴士</b>' + esc(s.tip) + "</div>" +
                "</div>"
              );
            }

            /* ---------- 面板渲染 ---------- */
            function segHtml(n) {
              return (
                '<li class="seg"><span class="seg-chip" data-mode="' + esc(n.mode) + '">' +
                esc(MODE_LABEL[n.mode] || n.mode) + "</span>" +
                "<span>" + fmtDist(n.distance) + " · 约 " + fmtDur(n.duration) + "</span></li>"
              );
            }

            function dayHtml(day) {
              return (
                '<section class="day" data-day="' + esc(day.id) + '">' +
                '<button type="button" class="g" data-day="' + esc(day.id) + '">' +
                '<i style="background:' + day.color + '"></i>' + esc(day.name) +
                "<em>" + esc(day.date) + " · " + day.stops.length + " 站</em></button>" +
                '<ol class="stops">' +
                day.stops
                  .map(function (s) {
                    return (
                      '<li class="stop" data-seq="' + s.seq + '">' +
                      '<span class="sq" style="background:' + day.color + '">' + s.seq + "</span>" +
                      '<div class="st-main"><b>' + esc(s.name) + "</b>" +
                      '<span class="intro">' + esc(s.desc) + "</span></div></li>" +
                      (s.next ? segHtml(s.next) : "")
                    );
                  })
                  .join("") +
                "</ol></section>"
              );
            }

            document.getElementById("u-groups").innerHTML = data.days.map(dayHtml).join("");

            document.getElementById("u-legend").innerHTML =
              data.days
                .map(function (d) {
                  return '<span class="lg"><i style="background:' + d.color + '"></i>' +
                    esc(d.name) + " · " + esc(d.date.split(" ")[0]) + "</span>";
                })
                .join("") +
              '<span class="lg lg-line"><i></i>每日足迹路线</span>';

            /* ---------- 视野留白：避开左侧面板与右下角二维码 ---------- */
            function padding() {
              var r = document.querySelector(".pnl").getBoundingClientRect();
              if (window.innerWidth <= 820) {
                return { top: 28, left: 24, right: 24, bottom: Math.ceil(r.height) + 30 };
              }
              return { top: 28, left: Math.ceil(r.width) + 28, right: 40, bottom: 172 };
            }

            function boundsOf(list) {
              var sw = new TMap.LatLng(Math.min.apply(null, list.map(function (p) { return p.lat; })),
                Math.min.apply(null, list.map(function (p) { return p.lng; })));
              var ne = new TMap.LatLng(Math.max.apply(null, list.map(function (p) { return p.lat; })),
                Math.max.apply(null, list.map(function (p) { return p.lng; })));
              return new TMap.LatLngBounds(sw, ne);
            }

            /* ---------- 分组筛选 ---------- */
            var active = data.days.map(function (d) { return d.id; });

            function applyFilter() {
              var isOn = function (d) { return active.indexOf(d) > -1; };
              markerLayer.setGeometries(markerGeos.filter(function (g) {
                return isOn(g.properties.day);
              }));
              lineLayer.setGeometries(lineGeos.filter(function (g) { return isOn(g._day); }));
              document.querySelectorAll(".g").forEach(function (el) {
                el.classList.toggle("off", active.indexOf(el.dataset.day) === -1);
              });
            }

            function fitAll() {
              map.fitBounds(boundsOf(flat), { padding: padding() });
            }

            function fitDay(dayId) {
              var day = data.days.filter(function (d) { return d.id === dayId; })[0];
              map.fitBounds(boundsOf(day.stops), { padding: padding() });
            }

            /* ---------- 选中：面板 ↔ 地图 双向联动 ---------- */
            function selectStop(seq, openCard) {
              var s = flat[seq - 1];
              if (!s) return;
              document.querySelectorAll(".stop").forEach(function (el) {
                el.classList.toggle("on", Number(el.dataset.seq) === seq);
              });
              var cur = document.querySelector('.stop[data-seq="' + seq + '"]');
              if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest", behavior: "smooth" });
              map.easeTo(
                { center: new TMap.LatLng(s.lat, s.lng), zoom: Math.max(map.getZoom(), 14) },
                { duration: 400 }
              );
              if (openCard !== false) {
                iw.setPosition(new TMap.LatLng(s.lat, s.lng));
                iw.setContent(iwHtml(s));
                iw.open();
              }
            }

            document.getElementById("u-groups").addEventListener("click", function (ev) {
              var stop = ev.target.closest(".stop");
              if (stop) { selectStop(Number(stop.dataset.seq), true); return; }
              var b = ev.target.closest(".g");
              if (!b) return;
              var id = b.dataset.day;
              if (active.length === 1 && active[0] === id) {
                active = data.days.map(function (d) { return d.id; });
                applyFilter();
                fitAll();
              } else {
                active = [id];
                applyFilter();
                fitDay(id);
              }
            });

            markerLayer.on("click", function (ev) {
              var seq = ev.geometry.properties.seq;
              selectStop(seq, true);
            });

            window.addEventListener("resize", function () {
              if (active.length === data.days.length) fitAll();
              else if (active.length === 1) fitDay(active[0]);
            });

            applyFilter();
            fitAll();
            tip.remove();
          } catch (e) {
            tip.className = "tip is-error";
            tip.textContent = "渲染失败：" + e.message;
            throw e;
          }
        }

        // TMap 未就绪时动态注入 SDK（URL 不带 key，鉴权走 _TMapSecurityConfig 代理）
        if (typeof TMap !== "undefined") {
          boot();
        } else {
          var sdk = document.createElement("script");
          sdk.setAttribute("src", "https://map.qq.com/api/gljs?v=1.exp");
          sdk.onload = boot;
          sdk.onerror = function () {
            var tip = document.getElementById("tip");
            tip.className = "tip is-error";
            tip.textContent = "地图 SDK 加载失败，请检查网络后刷新重试";
          };
          document.head.appendChild(sdk);
        }
      })();
    </script>
  </body>
</html>
